<text x="60" y="430" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17202a">Почему так</text>
<text x="60" y="470" font-family="Arial,sans-serif" font-size="19" fill="#4b5563">Фулфилмент зарабатывает на операциях разных клиентов. Поэтому модель сильнее награждает связь</text>
<text x="60" y="500" font-family="Arial,sans-serif" font-size="19" fill="#4b5563">«товар → клиент → правило → начисление → кабинет → канал продаж», чем промышленную мощность WMS вообще.</text>
<text x="60" y="635" font-family="Arial,sans-serif" font-size="16" fill="#57606a">Источник: SCORING_MODEL.csv · модель опубликована 05.09.2026</text>
